name: New guide request
description: Suggest a new how-to that would help Facthory customers
title: "Guide request: "
labels: ["documentation", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what how-to is missing. We prioritize guides that help customers complete real jobs in the product — not internal engineering topics.
  - type: input
    id: proposed_title
    attributes:
      label: Proposed guide title
      placeholder: How to invite teammates to a site
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Best section
      options:
        - getting-started
        - agents
        - knowledge
        - platform
        - integrations
        - billing
        - security
        - general
        - not sure
    validations:
      required: true
  - type: textarea
    id: job_to_be_done
    attributes:
      label: What job should this guide help someone finish?
      description: Customer outcome in plain language (no internals).
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who is it for?
      placeholder: Workspace admin, operator, knowledge author, …
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This request is about customer how-tos, not reverse-engineering product internals
          required: true
