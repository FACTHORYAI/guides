name: Documentation feedback
description: Report an error or gap in a customer guide (Notion is source of truth)
title: 'Docs feedback: '
labels: [documentation]
body:
  - type: input
    id: slug
    attributes:
      label: Doc slug or GitHub path
      description: e.g. getting-started or docs/getting-started/getting-started.md
      placeholder: docs/section/slug.md
    validations:
      required: true
  - type: input
    id: canonical
    attributes:
      label: Canonical marketing URL
      placeholder: https://facthory.com/resource/documentation/getting-started/
  - type: textarea
    id: details
    attributes:
      label: What is wrong or unclear?
      description: Maintainers apply fixes in Notion — do not open a PR to edit markdown here.
    validations:
      required: true
